name: Build Windows Installer

on:
  push:
    tags:
      - "vault-x-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Package Windows installer
        run: npm run dist:win

      - name: Read package version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-x-windows-${{ steps.version.outputs.value }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vault-x-v${{ steps.version.outputs.value }}
          name: Vault X v${{ steps.version.outputs.value }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          fail_on_unmatched_files: false
